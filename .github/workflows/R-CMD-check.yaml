# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # Prove Suggests-safety: the package must install and pass its tests
  # without the optional {fixest} dependency.
  test-without-fixest:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, no fixest)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # cache: false keeps this library hermetic — with caching on, a
      # prefix-matched cache restored from the full-dependency jobs brings
      # fixest (and every other Suggests) back into the library.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::pkgload

      # Belt and braces: drop fixest if anything installed it anyway. Checked
      # via the directory, not requireNamespace() — loading the namespace
      # would keep it loadable for the rest of the R session even after the
      # files are removed.
      - name: Remove fixest if present
        run: |
          for (lib in .libPaths()) {
            if (dir.exists(file.path(lib, "fixest"))) {
              remove.packages("fixest", lib = lib)
              cat("Removed fixest from", lib, "\n")
            }
          }
        shell: Rscript {0}

      - name: Test without suggested packages
        run: |
          stopifnot(!requireNamespace("fixest", quietly = TRUE))
          pkgload::load_all(".")
          testthat::test_local(stop_on_failure = TRUE)
        shell: Rscript {0}
